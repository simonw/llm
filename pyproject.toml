[project]
name = "llm"
version = "0.37.2"
description = "CLI utility and Python library for interacting with Large Language Models from organizations like OpenAI, Anthropic and Gemini plus local models installed on your own machine."
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Simon Willison" },
]
license = "Apache-2.0"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Utilities",
]

dependencies = [
    "click>=8.2.0",
    "httpx2>=0.28,<1",
    "condense-json>=1.1",
    "openai>=3,<4",
    "click-default-group>=1.2.3",
    "sqlite-utils>=4.0",
    "pydantic>=2.0.0,<3",
    "typing-extensions>=4.12",
    "PyYAML>=6.0",
    "pluggy>=1.5",
    "python-ulid>=2.0",
    "pyreadline3; sys_platform == 'win32'",
    "puremagic>=1.0",
]

[dependency-groups]
dev = [
    "build",
    "pytest",
    "numpy",
    "httpx2-pytest>=2",
    "pytest-asyncio",
    "cogapp",
    "mypy>=1.10.0",
    "black>=26.3.1",
    "pytest-recording",
    "ruff>=0.16.0",
    "syrupy",
    "types-click",
    "types-PyYAML",
    "types-setuptools",
    "llm-echo==0.5",
]

docs = [
    "sphinx==9.0.4",
    "furo==2025.12.19",
    "sphinx-autobuild",
    "sphinx-copybutton",
    "sphinx-markdown-builder==0.6.11",
    "myst-parser",
]

[project.urls]
Homepage = "https://github.com/simonw/llm"
Documentation = "https://llm.datasette.io/"
Issues = "https://github.com/simonw/llm/issues"
CI = "https://github.com/simonw/llm/actions"
Changelog = "https://github.com/simonw/llm/releases"

[project.scripts]
llm = "llm.cli:cli"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llm*"]

[tool.black]
target-version = ["py311"]
